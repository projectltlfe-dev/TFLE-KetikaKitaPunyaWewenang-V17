<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi 9 · Wewenang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --red:#e3343f;--blue:#3b6cc0;--blue-l:#6b94cf;--navy:#2b3f63;--navy-d:#1d2b47;
  --cream:#fbf4ea;--ink:#1d2433;--mute:#5d6880;--amber:#f2b33d;--orange:#ef8b2c;--green:#25a96f;--line:#e3e8f2;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.45,.64,1);--io:cubic-bezier(.65,0,.35,1);
}
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 30% 15%,#3b5a8f,#152038 72%);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink)}
button,input{font-family:inherit}
#stage{position:relative;width:min(100vw,440px);height:min(100vh,600px);height:min(100dvh,600px);
  overflow:hidden;overflow:clip;background:#dfe5ef;isolation:isolate;user-select:none;-webkit-user-select:none}
@media (min-width:480px){#stage{border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.45)}}

/* ============ WORLD ============ */
#cam{position:absolute;inset:0;transform-origin:50% 60%;transition:transform 1.4s var(--io),filter .8s;will-change:transform}
#cam.fast{transition:transform .65s cubic-bezier(.6,0,.4,1),filter .8s}
#cam.blur{filter:blur(3px) saturate(.9)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
#tint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2s ease,background 2s ease;mix-blend-mode:multiply;z-index:3}
#tint.morning{opacity:1;background:linear-gradient(180deg,rgba(255,196,120,.26),rgba(255,226,180,.1) 60%,rgba(255,240,220,0))}
#tint.tense{opacity:1;background:linear-gradient(180deg,rgba(34,62,112,.36),rgba(52,96,150,.26))}
#tint.golden{opacity:1;background:linear-gradient(180deg,rgba(255,150,90,.42),rgba(255,190,120,.18) 55%,rgba(110,70,150,.2))}
.sign{transform-origin:200px 0;animation:swing 6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.van{animation:van 13s linear infinite}
@keyframes van{0%{transform:translate(236px,330px)}32%{transform:translate(420px,330px)}100%{transform:translate(420px,330px)}}
.cloud{animation:cloud 26s linear infinite}
@keyframes cloud{from{transform:translateX(-40px)}to{transform:translateX(90px)}}
.cv{animation:belt 9s linear infinite}
@keyframes belt{from{transform:translate(84px,372px)}to{transform:translate(312px,372px)}}
.beltline{animation:dash .8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.walker{animation:walk 17s linear infinite}
@keyframes walk{0%{transform:translateX(0);opacity:0}4%{opacity:1}48%{transform:translateX(250px);opacity:1}52%{transform:translateX(262px);opacity:0}100%{opacity:0;transform:translateX(262px)}}
.lg1,.lg2{transform-box:fill-box;transform-origin:50% 0}
.lg1{animation:leg .45s ease-in-out infinite alternate}
.lg2{animation:leg .45s ease-in-out infinite alternate-reverse}
@keyframes leg{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.rays{animation:rays 7s ease-in-out infinite}
@keyframes rays{50%{opacity:.55}}
.scr{animation:scr 2.6s ease-in-out infinite}
@keyframes scr{50%{opacity:.82}}
.dust{animation:dust 9s ease-in-out infinite}
@keyframes dust{0%{transform:translate(0,0);opacity:0}20%{opacity:.8}100%{transform:translate(26px,-70px);opacity:0}}
.lampglow{animation:lamp 4s ease-in-out infinite}
@keyframes lamp{50%{opacity:.6}}

/* ============ CHARACTERS ============ */
#npcs{position:absolute;inset:0;z-index:1;pointer-events:none}
#player{position:absolute;left:50%;bottom:4%;height:54%;aspect-ratio:200/420;transform:translateX(-50%);
  transition:left 1.4s var(--ease),bottom 1.2s var(--ease),height 1.2s var(--ease),opacity .6s;z-index:2}
.bob{width:100%;height:100%;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.012) translateY(-1px)}}
.walking .bob{animation:walkb .42s ease-in-out infinite}
@keyframes walkb{50%{transform:translateY(-5px) rotate(.6deg)}}
.npc{position:absolute;bottom:4%;height:48%;aspect-ratio:200/420;transform:translateX(-50%);transition:left 1.6s var(--ease),opacity .7s ease}
.npc.back{height:37%;bottom:17%;filter:saturate(.85) brightness(.96)}
.npc.flip .bob{scale:-1 1}
.npc .cld{position:absolute;top:-9%;left:50%;transform:translateX(-50%);font-size:28px;animation:cldb 3s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
@keyframes cldb{50%{transform:translateX(-50%) translateY(-5px)}}
.npc .wsp{position:absolute;top:2%;left:50%;transform:translateX(-50%);font-size:18px;opacity:0;transition:opacity .4s}
.npc.whisper .wsp{opacity:1;animation:cldb 1.6s ease-in-out infinite}

.ch{width:100%;height:100%;display:block;overflow:visible}
.ch.crop{overflow:hidden}
.ch .mood{opacity:0;transition:opacity .3s ease}
.ch .eyes-open{transition:opacity .25s}
.ch[data-mood=happy] .eyes-open{opacity:0}
.ch .eyewrap{transform-box:fill-box;transform-origin:center;transition:transform .35s var(--ease)}
.ch[data-mood=shocked] .eyewrap{transform:scale(1.25)}
.ch[data-mood=think] .eyewrap{transform:translate(3px,-2px)}
.ch[data-mood=confused] .eyewrap{transform:translate(-2px,1px)}
.ch[data-mood=stressed] .eyewrap{transform:scaleY(.72)}
.ch[data-mood=awkward] .eyewrap{transform:translate(-4px,1px)}
.ch[data-mood=sick] .eyewrap{transform:translateY(1px) scaleY(.42)}
.ch[data-mood=down] .eyewrap{transform:translateY(3px) scaleY(.62)}
.ch[data-mood=weigh] .eyewrap{animation:lookLR 3.2s ease-in-out infinite}
@keyframes lookLR{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.ch[data-mood=weigh] .headg{animation:tiltH 3.2s ease-in-out infinite}
@keyframes tiltH{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.ch .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
.ch .sweat{opacity:0;transition:opacity .3s}
.ch[data-mood=confused] .sweat,.ch[data-mood=worried] .sweat,.ch[data-mood=stressed] .sweat{opacity:1}
.ch .sweat path{animation:drip 2.2s ease-in infinite}
@keyframes drip{0%{transform:translateY(-3px);opacity:0}25%{opacity:1}80%{opacity:1}100%{transform:translateY(9px);opacity:0}}
.ch .pz{opacity:0;transition:opacity .28s ease}
.ch .headg{transform-box:fill-box;transform-origin:50% 95%}
.ch.nod .headg{animation:nod 1s var(--ease)}
@keyframes nod{0%,100%{transform:none}22%{transform:translateY(4px)}44%{transform:none}66%{transform:translateY(3px)}}
.ch.shake{animation:shake .5s linear}
@keyframes shake{20%,60%{transform:translateX(-3px) rotate(-.6deg)}40%,80%{transform:translateX(3px) rotate(.6deg)}}
.ch.hop{animation:hop .8s var(--spring)}
@keyframes hop{30%{transform:translateY(-10px)}60%{transform:translateY(0)}}

.pocket{position:absolute;left:24%;top:43%;width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;
  background:var(--amber);color:#fff;font-size:20px;display:grid;place-items:center;opacity:0;transform:scale(.3);
  pointer-events:none;transition:opacity .4s,transform .5s var(--spring);box-shadow:0 6px 18px rgba(242,179,61,.6);z-index:3}
.pocket.show{opacity:1;transform:scale(1);pointer-events:auto;animation:wiggle .9s ease-in-out infinite}
.pocket::before,.pocket::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid var(--amber);animation:ring 1.4s ease-out infinite}
.pocket::after{animation-delay:.7s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}
@keyframes wiggle{0%,100%{rotate:0deg}20%{rotate:-14deg}40%{rotate:14deg}60%{rotate:-8deg}80%{rotate:6deg}}
.pocket-tip{position:absolute;left:50%;top:-38px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:var(--navy);
  font-size:11px;font-weight:800;padding:6px 10px;border-radius:99px;box-shadow:0 4px 12px rgba(0,0,0,.18);rotate:0deg}

/* ============ HUD ============ */
#hud{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:8px;padding:10px 12px;pointer-events:none}
#hud>*{pointer-events:auto}
.hchip{background:rgba(255,255,255,.94);border-radius:99px;padding:6px 10px;font-size:10.5px;font-weight:800;color:var(--navy);
  letter-spacing:.05em;box-shadow:0 4px 12px rgba(20,30,60,.14);white-space:nowrap;transition:opacity .4s}
#prog{flex:1;display:flex;gap:4px;transition:opacity .5s}
#prog i{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.6);overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
#prog i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--red),#ff6b5e);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--ease)}
#prog i.on::after{transform:scaleX(1)}
.hud-off #prog,.hud-off .hchip{opacity:0;pointer-events:none}
#bgmBtn{width:40px;height:40px;border-radius:50%;border:none;background:#fff;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(20,30,60,.22);transition:transform .25s var(--spring);flex:none;position:relative}
#bgmBtn:active{transform:scale(.88)}
#bgmBtn .eq{display:flex;gap:2px;align-items:flex-end;height:16px}
#bgmBtn .eq i{width:3px;background:var(--blue);border-radius:2px;height:4px;transition:height .3s}
#bgmBtn.on .eq i{animation:eq .9s ease-in-out infinite alternate}
#bgmBtn.on .eq i:nth-child(2){animation-delay:-.3s;background:var(--red)}
#bgmBtn.on .eq i:nth-child(3){animation-delay:-.6s}
#bgmBtn.on .eq i:nth-child(4){animation-delay:-.15s;background:var(--red)}
@keyframes eq{from{height:4px}to{height:16px}}
#bgmBtn .slash{position:absolute;width:26px;height:2.5px;background:var(--red);border-radius:2px;rotate:-45deg;transition:transform .3s var(--ease);transform:scaleX(1)}
#bgmBtn.on .slash{transform:scaleX(0)}

/* ============ SCENE BOX & DIALOG ============ */
#scene{position:absolute;top:60px;left:12px;right:12px;z-index:16;background:rgba(255,255,255,.96);border-radius:16px;padding:11px 13px 12px;
  box-shadow:0 10px 28px rgba(20,30,60,.2);opacity:0;transform:translateY(-12px);transition:opacity .45s,transform .6s var(--ease);pointer-events:none}
#scene.show{opacity:1;transform:none;pointer-events:auto}
#scene .tm{font-size:10px;font-weight:800;color:var(--red);letter-spacing:.1em}
#scene p{margin:3px 0 0;font-size:13px;line-height:1.48;font-weight:600;color:#2c3550}
#scene .btn{margin-top:10px;width:100%;padding:12px;font-size:13.5px}
#dialog{position:absolute;left:12px;right:12px;bottom:26px;z-index:15;border-radius:18px;padding:16px 16px 18px;min-height:84px;cursor:pointer;
  background:rgba(255,255,255,.97);box-shadow:0 12px 34px rgba(20,30,60,.28);
  transform:translateY(140%);opacity:0;transition:transform .6s var(--ease),opacity .4s,background .3s,color .3s}
#dialog.show{transform:none;opacity:1}
#dialog.narr{background:rgba(29,43,71,.95);color:#fff}
#dialog.think{background:rgba(255,255,255,.96);border:2px dashed #b9c6dd}
#dialog .who{position:absolute;top:-12px;left:14px;font-size:10.5px;font-weight:800;padding:5px 11px;border-radius:99px;background:var(--blue);color:#fff;letter-spacing:.04em}
#dialog.narr .who{background:var(--amber);color:var(--navy-d)}
#dialog.think .who{background:#7c8bb0}
#dialog.spv .who{background:var(--navy)}
#dialog.wsp .who{background:#8b6bd1}
#dialog .who:empty{opacity:0}
#dialog .txt{font-size:15px;line-height:1.5;font-weight:600;min-height:44px}
#dialog.think .txt,#dialog.wsp .txt{font-style:italic;color:#36415a}
#dialog .nx{position:absolute;right:14px;bottom:7px;font-size:10.5px;font-weight:700;opacity:0;transition:opacity .3s}
#dialog.done .nx{opacity:.55;animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}

/* ============ GENERIC ============ */
.panel{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;padding:62px 14px 28px;
  opacity:0;pointer-events:none;transform:scale(.97);transition:opacity .5s ease,transform .7s var(--ease)}
.panel.show{opacity:1;pointer-events:auto;transform:none}
.btn{border:none;border-radius:16px;padding:14px 18px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--red),#f0564f);box-shadow:0 8px 20px rgba(227,52,63,.35);transition:transform .2s var(--spring),opacity .35s,filter .3s}
.btn:active{transform:scale(.95)}
.btn:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed}
.btn.blue{background:linear-gradient(135deg,var(--blue),#5486d6);box-shadow:0 8px 20px rgba(59,108,192,.35)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 4px 14px rgba(20,30,60,.14)}
.btn.hid{opacity:0;pointer-events:none;transform:translateY(8px)}
.btn.pulse{animation:bpulse 1.8s ease-in-out infinite}
@keyframes bpulse{50%{box-shadow:0 8px 20px rgba(227,52,63,.35),0 0 0 6px rgba(227,52,63,.14)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.fu{animation:fadeUp .55s var(--ease) both}
#flash{position:absolute;inset:0;z-index:35;background:#fff;opacity:0;pointer-events:none;transition:opacity .2s ease}
#flash.on{opacity:.85}
#dim{position:absolute;inset:0;z-index:23;background:rgba(15,22,40,.5);opacity:0;pointer-events:none;transition:opacity .45s}
#dim.on{opacity:1;pointer-events:auto}
#copy{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:9px;font-weight:600;color:rgba(29,43,71,.55);z-index:45;pointer-events:none;letter-spacing:.03em}
#copy.light{color:rgba(255,255,255,.6)}

/* ============ SHEET ============ */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:24;background:#fff;border-radius:26px 26px 0 0;padding:12px 14px 24px;
  transform:translateY(calc(100% + 50px));transition:transform .65s var(--ease);box-shadow:0 -12px 40px rgba(0,0,0,.22);max-height:88%;overflow-y:auto}
#sheet.show{transform:none}
#sheet .grab{width:42px;height:5px;border-radius:9px;background:#d6dce8;margin:0 auto 10px}
.s-tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--red)}
.s-title{font-size:19px;font-weight:800;margin:3px 0 3px;color:var(--navy-d)}
.s-sub{font-size:12px;color:var(--mute);margin-bottom:2px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;
  padding:10px 12px;margin-top:8px;cursor:pointer;color:var(--ink);transition:transform .2s var(--spring),border-color .25s,background .25s,opacity .3s;animation:fadeUp .5s var(--ease) both}
.opt:active{transform:scale(.97)}
.opt .k{flex:none;width:34px;height:34px;border-radius:11px;background:#eef3fc;font-size:18px;display:grid;place-items:center}
.opt b{display:block;font-size:14px;margin-bottom:2px}
.opt span{font-size:12px;color:var(--mute);line-height:1.4}
.opt.sel{border-color:var(--red);background:#fff4f4;transform:scale(1.02)}
.opt.fade{opacity:.35}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rchip{border:2px solid var(--line);background:#f7f9fd;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;color:var(--navy);text-align:left;
  cursor:pointer;animation:fadeUp .45s var(--ease) both;transition:transform .2s var(--spring),background .25s,border-color .25s,color .25s}
.rchip:active{transform:scale(.97)}
.rchip.sel{background:var(--navy);border-color:var(--navy);color:#fff}

/* ============ PHONE ============ */
#peekBg{position:absolute;inset:0;z-index:19;background:rgba(9,13,22,.45);opacity:0;pointer-events:none;transition:opacity .45s}
#peekBg.on{opacity:1;pointer-events:auto;cursor:pointer}
#peekBg.light{background:rgba(9,13,22,.14)}
#peekBg .tip{position:absolute;top:58px;left:12px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(29,43,71,.85);padding:6px 10px;border-radius:99px;max-width:60%}
#peekBg.light .tip{top:auto;bottom:62px;left:8px;max-width:33%;font-size:9.5px;line-height:1.3;border-radius:10px}
#phone{position:absolute;bottom:0;height:85%;z-index:20;transform:translateY(105%);transition:transform .65s var(--ease)}
#phone.full{left:50%;width:min(86%,340px);margin-left:max(-43%,-170px);height:80%}
#phone.split{right:8px;width:60%}
#phone.show{transform:none}
#phone.docked{transform:translateY(105%)}
#dock{position:absolute;bottom:18px;z-index:21;height:48px;border-radius:16px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transform:translateY(160%);transition:transform .5s var(--ease);box-shadow:0 10px 24px rgba(20,30,60,.35);left:12px;right:12px}
#dock.split{left:auto;right:8px;width:60%}
#dock.show{transform:none;animation:dockp 1.8s ease-in-out .6s infinite}
@keyframes dockp{50%{box-shadow:0 10px 24px rgba(20,30,60,.35),0 0 0 5px rgba(59,108,192,.25)}}
#dock i{font-style:normal;background:var(--red);border-radius:99px;font-size:10px;padding:2px 7px;display:none}
#dock i.on{display:inline-block}
.ph-frame{height:100%;background:#0f1626;border-radius:34px 34px 0 0;padding:8px 8px 0;box-shadow:0 -10px 40px rgba(0,0,0,.4);position:relative}
.ph-screen{height:100%;border-radius:27px 27px 0 0;overflow:hidden;display:flex;flex-direction:column;
  background:#e9eef6 radial-gradient(circle at 20% 30%,rgba(107,148,207,.12) 0 2px,transparent 3px) 0 0/22px 22px}
.ph-status{display:flex;justify-content:space-between;align-items:center;padding:7px 18px 3px;font-size:10.5px;font-weight:800;color:#fff;background:var(--navy)}
.ph-notch{width:64px;height:15px;background:#0f1626;border-radius:0 0 12px 12px;position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:2}
.ph-head{display:flex;align-items:center;gap:9px;padding:6px 11px 9px;background:var(--navy);color:#fff;position:relative}
.ph-head .av{width:40px;height:40px;border-radius:50%;background:#dfe7f5;overflow:hidden;flex:none;display:grid;place-items:center;font-size:18px;position:relative}
.ph-head .av.pop{animation:avpop .5s var(--spring)}
@keyframes avpop{0%{transform:scale(.8)}100%{transform:none}}
.ph-head b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-head small{font-size:10.5px;opacity:.75;transition:color .3s;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-head small.typ{color:#8ff0c0;opacity:1}
.ph-head .nm{min-width:0;flex:1}
.rx{position:absolute;right:10px;bottom:-11px;background:#fff;color:var(--navy-d);font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;
  box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transform:translateY(6px) scale(.85);transition:all .45s var(--spring);z-index:2;white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis}
.rx.show{opacity:1;transform:none}
.rx.esc{background:#2f7cf6;color:#fff}
.ph-msgs{flex:1;overflow-y:auto;padding:14px 9px 10px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.ph-msgs::-webkit-scrollbar{width:0}
.msg{max-width:86%;padding:7px 10px 6px;border-radius:14px;font-size:13px;line-height:1.42;box-shadow:0 1px 2px rgba(0,0,0,.08);animation:msgIn .45s var(--spring) both;transform-origin:left bottom}
.msg.in{align-self:flex-start;background:#fff;border-top-left-radius:5px}
.msg.out{align-self:flex-end;background:#d4e4ff;border-top-right-radius:5px;transform-origin:right bottom}
@keyframes msgIn{from{opacity:0;transform:scale(.7) translateY(8px)}to{opacity:1;transform:none}}
.msg .sn{font-size:10.5px;font-weight:800;display:block;margin-bottom:1px}
.msg .tm{font-size:9px;opacity:.5;float:right;margin:7px 0 -3px 8px}
.msg .tick{color:#3b8de0;letter-spacing:-3px;margin-left:3px}
#phone.split .msg{font-size:12.5px;max-width:93%}
.typing{align-self:flex-start;background:#fff;border-radius:14px;border-top-left-radius:5px;padding:10px 12px;display:flex;gap:4px;animation:msgIn .3s var(--ease) both}
.typing i{width:7px;height:7px;border-radius:50%;background:#9aa7bf;animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.divider{align-self:center;background:rgba(43,63,99,.12);color:var(--navy);font-size:10px;font-weight:800;padding:4px 10px;border-radius:99px;margin:3px 0;animation:fadeUp .4s var(--ease) both;text-align:center}
.file{display:flex;gap:10px;align-items:center;background:#f2f5fb;border-radius:11px;padding:9px;cursor:pointer;margin-top:2px;border:1.5px solid transparent;transition:border-color .3s}
.file.pulse{border-color:var(--red);animation:fpulse 1.2s ease-in-out infinite}
@keyframes fpulse{50%{box-shadow:0 0 0 5px rgba(227,52,63,.15)}}
.file .ic{width:34px;height:40px;border-radius:5px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;flex:none}
.file b{font-size:12px;display:block}.file small{font-size:10.5px;color:var(--mute)}
.crow{display:flex;gap:9px;align-items:center;background:#fff;border-radius:13px;padding:8px 9px;animation:fadeUp .45s var(--ease) both;transition:background .3s,transform .3s var(--spring)}
.crow .av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#dfe7f5;flex:none;display:grid;place-items:center;font-size:17px}
.crow .ct{flex:1;min-width:0}.crow b{font-size:12.5px;display:block}
.crow small{font-size:11px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .bd{flex:none;font-size:9.5px;color:var(--mute);text-align:right}
.crow .bd i{display:block;margin:3px 0 0 auto;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-style:normal;font-size:10px;font-weight:800;line-height:18px;text-align:center}
.crow.tap{background:#dbe7ff;transform:scale(.97)}
.ph-foot{padding:9px 9px 22px;background:#fff;min-height:58px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.reply{border:2px solid var(--blue);background:#f3f7ff;color:var(--navy-d);border-radius:14px;padding:9px 10px;font-size:12.5px;font-weight:700;line-height:1.35;
  text-align:left;cursor:pointer;animation:fadeUp .45s var(--ease) both;display:flex;gap:8px;align-items:center;transition:transform .2s var(--spring)}
.reply:active{transform:scale(.97)}
.reply .snd{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px}
.reply.act{border-color:var(--red);background:#fff5f5}
.reply.act .snd{background:var(--red)}
.reply .lb{display:block;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--red);margin-bottom:1px}
.ph-hint{font-size:11.5px;color:var(--mute);text-align:center;font-weight:600}

/* ============ MODAL ============ */
#modal{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:58px 16px 26px;
  background:rgba(15,22,40,.55);opacity:0;pointer-events:none;transition:opacity .4s}
#modal.show{opacity:1;pointer-events:auto}
.mcard{width:100%;max-width:350px;max-height:100%;background:#fff;border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.4);
  transform:translateY(30px) scaleY(.6);transform-origin:50% 0;transition:transform .6s var(--ease);position:relative;overflow:hidden}
#modal.show .mcard{transform:none}
.doc-h{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:10px}
.doc-h small{font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.08em;display:block}
.doc-h b{font-size:15px;color:var(--navy-d);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:92px 1fr;gap:6px 8px;font-size:12.5px}
.kv span{color:var(--mute);font-weight:600}.kv b{color:var(--ink)}
.kv em{color:#9aa7bf;font-weight:600}
.pill{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:#fff3da;color:#b77a00}
.stamp{position:absolute;left:50%;bottom:70px;border:3px solid var(--red);color:var(--red);font-weight:800;font-size:12px;letter-spacing:.06em;line-height:1.3;text-align:center;
  padding:6px 12px;border-radius:8px;rotate:-9deg;opacity:0;transform:translateX(-50%) scale(2.5);background:rgba(255,255,255,.7);white-space:nowrap}
.stamp small{display:block;font-size:10px;letter-spacing:.12em}
.stamp.go{animation:stampIn .4s cubic-bezier(.5,0,.75,0) .35s forwards}
@keyframes stampIn{to{opacity:.92;transform:translateX(-50%) scale(1)}}
.mcard .btn{width:100%;margin-top:14px}
.mcard.shk{animation:mshk .4s linear}
@keyframes mshk{20%{translate:-4px 2px}40%{translate:4px -2px}60%{translate:-3px 1px}80%{translate:2px 0}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:#f3f6fb;border-radius:12px;padding:9px 10px}
.stats small{display:block;font-size:10px;font-weight:700;color:var(--mute)}
.stats b{font-size:20px;color:var(--navy-d)}
.stats b.r{color:var(--red)}

/* ============ TIMECARD ============ */
#timecard{position:absolute;inset:0;z-index:33;background:var(--navy-d);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  opacity:0;pointer-events:none;transition:opacity .55s ease}
#timecard.show{opacity:1}
.clock{width:70px;height:70px;border-radius:50%;border:4px solid #fff;position:relative}
.clock i{position:absolute;left:50%;bottom:50%;width:4px;border-radius:3px;background:#fff;transform-origin:50% 100%;margin-left:-2px}
.clock .h{height:18px;animation:spin 6s linear infinite}
.clock .mn{height:27px;background:var(--amber);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#timecard b{font-size:16px;font-weight:800;letter-spacing:.06em;text-align:center;padding:0 24px}

/* ============ START / ID CARD ============ */
#start{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 16px 26px;gap:8px;
  background:linear-gradient(180deg,rgba(29,43,71,.72),rgba(29,43,71,.94));color:#fff;transition:opacity .6s ease}
#start.out{opacity:0;pointer-events:none}
#start.hide{display:none}
.st-head{text-align:center;animation:fadeUp .6s var(--ease) both}
.st-tag{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--amber)}
.st-title{font-size:22px;font-weight:800;line-height:1.15;margin:2px 0 0}
.st-title span{color:#ff7d76}
.badge-wrap{width:min(100%,330px);display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:dropIn .9s var(--spring) .1s both}
.badge-wrap.swing{animation:pend 4.5s ease-in-out infinite}
@keyframes dropIn{from{opacity:0;transform:translateY(-40px) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes pend{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.badge-wrap.toScan{animation:none;transform:translateY(34px) rotate(0);transition:transform .45s var(--ease)}
.strap{width:18px;height:22px;background:linear-gradient(#1f6fd1,#1857a8);border-radius:2px 2px 0 0}
.clip{width:30px;height:12px;border-radius:4px;background:#c9d3e6;margin-top:-2px;box-shadow:inset 0 -3px 0 #a9b6cc}
.idc{width:100%;background:#fff;border-radius:18px;color:var(--ink);overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.35);position:relative;margin-top:-4px;transition:box-shadow .3s}
.idc-head{background:linear-gradient(135deg,var(--red),#f0564f);color:#fff;padding:9px 14px;display:flex;align-items:center;justify-content:space-between}
.idc-head b{font-size:13px;font-weight:800}
.idc-head small{font-size:9.5px;font-weight:800;letter-spacing:.1em;opacity:.9}
.idc-body{padding:11px 14px 13px}
.picks{display:flex;gap:10px}
.pick{flex:1;border:2.5px solid var(--line);border-radius:14px;background:#f3f6fb;padding:5px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:opacity .4s,filter .4s,border-color .3s,background .3s,transform .5s var(--spring)}
.pick .ph{width:84px;height:84px;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 70%,#fbf4ea 55%,#e6ecf6)}
.pick small{font-size:11px;font-weight:800;color:var(--navy)}
.pick.sel{border-color:var(--red);background:#fff4f4;transform:scale(1.06);z-index:1}
.picks.chosen .pick:not(.sel){opacity:.35;filter:grayscale(.6);transform:scale(.95)}
.idc-lb{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--mute);margin:10px 0 6px}
.qrow{display:flex;gap:6px;flex-wrap:wrap}
.qchip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:800;color:var(--navy);cursor:pointer;transition:transform .2s var(--spring),background .25s,border-color .25s,color .25s}
.qchip:active{transform:scale(.92)}
.qchip.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.qchip.own{border-style:dashed;color:var(--mute)}
.inp{width:100%;border:2px solid var(--blue);background:#fff;color:var(--ink);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:800;outline:none;margin-top:7px;display:none}
.inp.show{display:block;animation:fadeUp .35s var(--ease)}
.sapa{margin-top:9px;font-size:13px;color:var(--navy-d);font-weight:800;background:#f3f6fb;border-radius:10px;padding:8px 10px;text-align:center;transition:background .3s}
.sapa small{display:block;font-size:10px;color:var(--mute);font-weight:700;letter-spacing:.06em}
.sapa.lock{background:#e7f8ef}
.scanline{position:absolute;left:0;right:0;top:0;height:3px;background:#25d07a;box-shadow:0 0 14px 3px rgba(37,208,122,.7);opacity:0;pointer-events:none}
.idc.scan .scanline{animation:scan .6s ease-in-out}
@keyframes scan{0%{top:0;opacity:1}100%{top:100%;opacity:1}}
.idc.ok{box-shadow:0 0 0 4px #25d07a,0 16px 40px rgba(0,0,0,.35)}
.scanner{width:120px;height:16px;border-radius:8px 8px 4px 4px;background:#2b3f63;margin-top:-2px;position:relative;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.scanner i{position:absolute;left:50%;top:4px;width:30px;height:5px;border-radius:9px;background:#3b5172;transform:translateX(-50%);transition:background .2s,box-shadow .2s}
.scanner.on i{background:#25d07a;box-shadow:0 0 12px 3px rgba(37,208,122,.8)}
#goBtn{width:min(100%,330px)}

/* ============ RKB ============ */
#rkb{background:linear-gradient(180deg,#14223b,#22375a);padding-bottom:22px}
#rkb::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(80,200,255,.18),transparent 70%);pointer-events:none}
.mon{flex:1;display:flex;flex-direction:column;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 0 40px rgba(80,180,255,.25),0 18px 40px rgba(0,0,0,.35);min-height:0;position:relative}
.mon-top{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#f1f4fa;border-bottom:1px solid var(--line)}
.mon-top .d{width:9px;height:9px;border-radius:50%}
.mon-top b{font-size:11.5px;margin-left:6px;color:var(--navy)}
.mon-body{padding:10px 12px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}
.rk-top{display:flex;gap:10px;align-items:flex-start}
.rk-date{flex:1;min-width:0}
.rk-date small{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--mute);display:block}
.rk-date b{font-size:15px;color:var(--navy-d);line-height:1.25;display:block}
.cap{width:118px;flex:none;background:#f3f6fb;border-radius:12px;padding:7px 9px}
.cap small{font-size:9px;font-weight:800;color:var(--mute);letter-spacing:.04em;display:block}
.cap b{font-size:20px;color:var(--green);transition:color .4s;display:block;line-height:1.1}
.cap b.bad{color:var(--red)}
.cbar{height:7px;border-radius:9px;background:#e1e7f0;overflow:hidden;margin-top:4px}
.cbar i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,var(--green),#4fd39a);transition:width 1.1s var(--ease),background .6s}
.cbar i.bad{background:linear-gradient(90deg,var(--red),var(--amber))}
.warnlb{font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:10px;padding:6px 10px;text-align:center;opacity:0;transform:scale(.8);transition:all .5s var(--spring)}
.warnlb.show{opacity:1;transform:none}
.rows{display:flex;flex-direction:column;gap:5px;min-height:0}
.row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:12px;border:1.5px solid var(--line);animation:fadeUp .5s var(--ease) both;transition:border-color .3s,background .3s,transform .3s var(--spring)}
.row .no{font-size:11px;font-weight:800;color:var(--mute);width:12px}
.row .av{width:28px;height:28px;border-radius:50%;background:#e8eef8;overflow:hidden;flex:none}
.row .nm{flex:1;min-width:0}.row .nm b{font-size:12.5px;display:block}.row .nm small{font-size:10.5px;color:var(--mute)}
.st{font-size:9.5px;font-weight:800;padding:4px 8px;border-radius:99px;transition:all .4s var(--ease);white-space:nowrap}
.st.ok{background:#e1f6ec;color:var(--green)}
.st.sick{background:var(--red);color:#fff}
.st.leave{background:#ffe9a8;color:#8a5a00}
.row.blink{animation:rblink .5s ease-in-out 2}
@keyframes rblink{50%{background:#ffd5d8;border-color:var(--red)}}
.row.sk{border-color:#ffc9cc;background:#fff6f6}
.row.hl{border-color:var(--amber);background:#fffaf0;cursor:pointer;animation:rowp 1.3s ease-in-out infinite}
@keyframes rowp{50%{box-shadow:0 0 0 5px rgba(242,179,61,.25);transform:scale(1.015)}}
.hint{font-size:11.5px;font-weight:700;color:#a36d00;background:#fff6e3;border-radius:10px;padding:8px 10px;text-align:center;opacity:0;transform:translateY(6px);transition:all .5s var(--ease)}
.hint.show{opacity:1;transform:none}

/* ============ SPLIT ============ */
#split{padding:0;z-index:11;background:linear-gradient(100deg,#fbf4ea 0 36%,#22375a 36.2% 100%)}
#split::before{content:'';position:absolute;left:-30%;top:24%;width:70%;aspect-ratio:1;border-radius:50%;background:#f3e3cc;opacity:.7}
.sp-left{position:absolute;left:0;top:0;bottom:0;width:37%;z-index:1}
.sp-face{position:absolute;left:-6%;right:-6%;bottom:22px;aspect-ratio:156/200}
.sp-name{position:absolute;left:8px;bottom:30px;background:var(--navy);color:#fff;font-size:10px;font-weight:800;padding:4px 9px;border-radius:99px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-bub{position:absolute;left:8px;right:6px;top:64px;background:#fff;border-radius:16px;padding:10px 11px;font-size:12px;font-weight:600;line-height:1.42;color:#36415a;
  box-shadow:0 8px 20px rgba(20,30,60,.15);opacity:0;transform:translateY(8px) scale(.94);transition:opacity .4s,transform .5s var(--spring)}
.sp-bub.show{opacity:1;transform:none}
.sp-bub i{font-style:italic}
.sp-bub::after{content:'';position:absolute;left:40%;bottom:-13px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:6px 8px 0 -3px #fff}
.sp-bub b{color:var(--red)}
.sp-bub .tg{display:block;font-size:9.5px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--amber);color:var(--navy-d);border-radius:6px;padding:3px 6px;margin-bottom:5px;width:max-content}
.sp-board{position:absolute;right:8px;width:60%;top:64px;bottom:84px;z-index:0;color:#fff;display:flex;flex-direction:column;gap:7px;padding:6px 4px}
.sp-board h4{margin:0 0 2px;font-size:10px;letter-spacing:.12em;color:#9fb6dc}
.sp-board .d{font-size:14px;font-weight:800;margin-bottom:4px}
.bf{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.4;animation:fadeUp .5s var(--ease) both}
.bf b{display:block;font-size:11px;letter-spacing:.04em;color:#ffd36b}
.bf.new{border-color:var(--amber);background:rgba(242,179,61,.16)}
.sp-act{position:absolute;left:12px;right:12px;bottom:24px;z-index:2}
.sp-act .btn{width:100%}

/* ============ SEESAW ============ */
#seesaw{background:radial-gradient(circle at 50% 38%,#fff8ec,#e9eef8 70%);gap:8px;align-items:stretch}
.fact{align-self:center;background:var(--amber);color:var(--navy-d);font-size:11px;font-weight:800;padding:7px 12px;border-radius:10px;text-align:center;line-height:1.35;animation:popIn .6s var(--spring) both}
.ss{position:relative;height:208px;margin-top:30px}
.ss-kordel{position:absolute;left:50%;top:0;width:150px;aspect-ratio:200/210;transform:translateX(-50%);z-index:0}
.ss-beam{position:absolute;left:3%;right:3%;top:138px;height:10px;border-radius:8px;background:var(--navy);transform-origin:50% 50%;
  transform:rotate(var(--t,0deg));transition:transform 1.1s var(--spring);z-index:2}
.ss-pan{position:absolute;bottom:10px;width:40%;border:none;background:#fff;border-radius:14px 14px 4px 4px;padding:7px 6px 6px;text-align:center;cursor:pointer;
  box-shadow:0 8px 18px rgba(20,30,60,.16);transition:transform .35s var(--spring),box-shadow .3s}
.ss-pan.l{left:0;border-top:4px solid var(--blue)}.ss-pan.r{right:0;border-top:4px solid var(--orange)}
.ss-pan .ico{font-size:21px;line-height:1.1;display:block}
.ss-pan b{display:block;font-size:10px;font-weight:800;letter-spacing:.03em}
.ss-pan small{display:block;font-size:10px;font-weight:600;color:var(--mute);line-height:1.25}
.ss-pan.l b{color:var(--blue)}.ss-pan.r b{color:#c76a10}
.ss-pan.r{opacity:0;transform:translateY(-140px)}
.ss-pan.r.drop{animation:wdrop .7s cubic-bezier(.55,0,1,.45) forwards}
@keyframes wdrop{0%{opacity:1;transform:translateY(-140px)}100%{opacity:1;transform:none}}
.ss-pan.r.in{opacity:1;transform:none}
.ss-pan.on{box-shadow:0 0 0 3px var(--amber),0 8px 18px rgba(20,30,60,.16)}
.ss-ful{position:absolute;left:50%;top:146px;width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:44px solid var(--red);transform:translateX(-50%);z-index:1}
.ss-base{position:absolute;left:30%;right:30%;top:189px;height:6px;border-radius:9px;background:rgba(29,43,71,.15)}
.ss-pop{position:absolute;left:50%;top:-4px;transform:translate(-50%,-4px) scale(.8);background:var(--navy);color:#fff;font-size:12px;font-weight:800;padding:8px 12px;border-radius:14px;
  white-space:nowrap;opacity:0;transition:all .5s var(--spring);z-index:3;box-shadow:0 8px 18px rgba(20,30,60,.25)}
.ss-pop::after{content:'';position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--navy);transform:translateX(-50%) rotate(45deg)}
.ss-pop.show{opacity:1;transform:translate(-50%,-12px) scale(1)}
.ss-info{font-size:12px;font-weight:600;color:var(--navy);background:#fff;border-radius:12px;padding:8px 11px;text-align:center;min-height:36px;line-height:1.4}
.ss-q{font-size:14px;font-weight:800;color:var(--navy-d);text-align:center;line-height:1.35;opacity:0;transition:opacity .5s}
.ss-btns{display:flex;gap:8px;opacity:0;transform:translateY(10px);transition:all .5s var(--ease);pointer-events:none}
.ss-btns.show,.ss-q.show{opacity:1;transform:none;pointer-events:auto}
.ubtn{flex:1;border:2px solid var(--line);background:#fff;border-radius:16px;padding:11px 8px;cursor:pointer;transition:transform .2s var(--spring),border-color .3s,background .3s}
.ubtn:active{transform:scale(.96)}
.ubtn b{display:block;font-size:13px;color:var(--navy-d)}
.ubtn small{font-size:10.5px;color:var(--mute);display:block;margin-top:2px;line-height:1.3}
.ubtn.sel{background:var(--navy);border-color:var(--navy)}
.ubtn.sel b,.ubtn.sel small{color:#fff}

/* ============ LENS ============ */
#lens{background:linear-gradient(180deg,rgba(29,43,71,.97),rgba(43,63,99,.98));color:#fff;gap:10px}
.lz-top{display:flex;align-items:center;gap:10px}
.lz-k{width:66px;height:66px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 70%,#fbf4ea 55%,#dfe7f5);flex:none;border:3px solid rgba(255,255,255,.25)}
.lz-h small{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--amber)}
.lz-h b{display:block;font-size:19px;margin-top:1px}
.lz-h span{font-size:12px;opacity:.7}
.lenses{position:relative;display:flex;justify-content:space-between;padding:4px 6px 0}
.lz-line{position:absolute;left:16%;right:16%;top:42px;height:4px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.lz-line i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),#ffd36b);transition:width .8s var(--ease)}
.lz{position:relative;z-index:1;width:31%;border:none;background:none;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;padding:0}
.lz .o{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:29px;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.2);
  transition:all .5s var(--spring);filter:grayscale(1);opacity:.55}
.lz b{font-size:10.5px;font-weight:800;letter-spacing:.08em;opacity:.55;transition:opacity .4s}
.lz.next .o{opacity:1;filter:none;border-color:var(--amber);animation:lzp 1.3s ease-in-out infinite}
@keyframes lzp{50%{box-shadow:0 0 0 8px rgba(242,179,61,.18)}}
.lz.lit .o{opacity:1;filter:none;background:radial-gradient(circle,#fff6d8,#f2b33d);border-color:#fff;box-shadow:0 0 26px rgba(242,179,61,.75);transform:scale(1.06)}
.lz.lit b,.lz.next b{opacity:1}
.lz-card{background:#fff;color:var(--ink);border-radius:18px;padding:14px;min-height:126px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.lz-card .t{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--red)}
.lz-card .q{font-size:15px;font-weight:800;color:var(--navy-d);margin:4px 0 8px;line-height:1.35}
.lz-card .c{font-size:12px;font-weight:600;color:#5a4630;background:var(--cream);border-radius:10px;padding:8px 10px;line-height:1.4}
.lz-card .ph0{font-size:13px;color:var(--mute);font-weight:600;text-align:center;padding:28px 0}
.lz-note{text-align:center;font-size:13px;font-weight:800;color:#ffd36b;opacity:0;transform:translateY(6px);transition:all .5s var(--ease)}
.lz-note.show{opacity:1;transform:none}
#lzGo{margin-top:auto}

/* ============ ENDING ============ */
#ending{justify-content:flex-end;padding:0;z-index:13}
.end-card{background:#fff;border-radius:26px 26px 0 0;padding:38px 16px 24px;position:relative;box-shadow:0 -14px 40px rgba(0,0,0,.25);
  transform:translateY(110%);transition:transform .9s var(--ease) .15s}
#ending.show .end-card{transform:none}
.ebadge{position:absolute;top:-32px;left:50%;translate:-50% 0;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:29px;
  background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.2);border:4px solid var(--c)}
.ebadge::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--c);opacity:.4;animation:ring 2s ease-out infinite}
.e-tag{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--c)}
.e-title{text-align:center;font-size:20px;font-weight:800;color:var(--navy-d);margin:3px 0 7px;line-height:1.2}
.e-txt{font-size:12.5px;line-height:1.48;color:#3a4560;text-align:center;margin:0 0 11px}
.e-use{background:color-mix(in srgb,var(--c) 10%,#fff);border:1.5px solid color-mix(in srgb,var(--c) 35%,#fff);border-radius:12px;padding:8px 11px;text-align:center;font-size:11px;font-weight:700;color:var(--mute);margin-bottom:9px}
.e-use b{display:block;font-size:13.5px;color:var(--navy-d);margin-top:1px;line-height:1.35}
.e-st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.e-st div{background:#f3f6fb;border-radius:12px;padding:8px 6px;text-align:center;opacity:0;transform:translateY(8px);transition:all .5s var(--ease)}
.e-st div.on{opacity:1;transform:none}
.e-st small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--mute)}
.e-st span{display:block;font-size:20px;margin:2px 0}
.e-st b{font-size:11px;color:var(--navy-d);line-height:1.25;display:block}
.e-btns{display:flex;gap:8px}
.e-btns .btn{flex:1;padding:12px 8px;font-size:13.5px}
.fx{position:absolute;inset:0;pointer-events:none;z-index:14;overflow:hidden}
.fx i{position:absolute;left:50%;top:30%;width:9px;height:14px;border-radius:2px}

/* ============ REFLECTION ============ */
#reflect{background:linear-gradient(180deg,rgba(255,236,206,.55),rgba(251,244,234,.97) 34%);gap:9px;z-index:13;padding-bottom:24px}
.rf-top{display:flex;align-items:center;gap:10px}
.rf-k{width:44px;height:44px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 70%,#fff 55%,#f1e3cc);flex:none;border:3px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.12)}
.rf-h small{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:#b86a00}
.rf-h b{display:block;font-size:18px;color:var(--navy-d);line-height:1.2}
.rf-stage{position:relative;flex:1;min-height:0}
.rcard{position:absolute;inset:0;background:#fff;border-radius:20px;padding:18px 16px;box-shadow:0 14px 34px rgba(80,50,10,.14);display:flex;flex-direction:column;gap:9px;
  transition:transform .6s var(--ease),opacity .45s}
.rcard.enter{transform:translateX(40px);opacity:0}
.rcard.exit{transform:translateX(-40px);opacity:0}
.rcard.me{gap:5px;overflow-y:auto;border-top:5px solid var(--c);padding:12px 13px}
.rcard.me h3{font-size:14.5px}
.sec{border-radius:12px;padding:6px 10px}
.sec b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.04em;margin-bottom:2px}
.sec p{margin:1px 0 0;font-size:11.8px;line-height:1.36;color:#3a4560}
.sec.ok{background:#e9f8f0}.sec.ok b{color:#178a57}
.sec.warn{background:#fff3e2}.sec.warn b{color:#b5630a}
.sec.warn p{padding-left:10px;position:relative}.sec.warn p::before{content:'';position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:#e09a14}
.sec.nx{background:#eef3fc}.sec.nx b{color:var(--blue)}
.rcard .n{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--red)}
.rcard h3{margin:0;font-size:19px;line-height:1.28;color:var(--navy-d)}
.rcard p{margin:0;font-size:13.5px;line-height:1.55;color:#3a4560}
.rcard .q{margin-top:auto;background:var(--cream);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;color:#6b4a14;line-height:1.45}
.rcard .rules{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.rcard .rules div{display:flex;gap:9px;align-items:center;background:#f3f6fb;border-radius:12px;padding:8px 10px;font-size:12.5px;color:var(--navy-d);font-weight:600}
.rcard .rules b{flex:none;font-size:11px;letter-spacing:.04em;background:var(--navy);color:#fff;border-radius:8px;padding:4px 7px;min-width:78px;text-align:center}
.rf-dots{display:flex;gap:6px;justify-content:center}
.rf-dots i{width:7px;height:7px;border-radius:9px;background:#e2d6c2;transition:all .35s}
.rf-dots i.on{width:22px;background:var(--navy)}

/* ============ CLOSING ============ */
#closing{justify-content:flex-end;padding:0;z-index:13}
.cl-card{background:#fff;border-radius:26px 26px 0 0;padding:18px 15px 24px;box-shadow:0 -14px 40px rgba(0,0,0,.25);transform:translateY(110%);transition:transform .9s var(--ease) .2s}
#closing.show .cl-card{transform:none}
.say{background:var(--navy);color:#fff;border-radius:16px 16px 16px 4px;padding:11px 13px;font-size:12.5px;line-height:1.5;font-weight:600;position:relative}
.say b{color:#ffd36b}
.say .who{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;color:#9fb6dc;margin-bottom:2px}
.v18{border:2px solid var(--line);border-radius:14px;padding:9px 12px;font-size:11px;font-weight:700;color:var(--mute);margin:9px 0;display:flex;gap:10px;align-items:center}
.v18 b{display:block;font-size:13px;color:var(--navy-d)}
.v18 .nx{flex:none;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px}
.coll{margin-bottom:10px}
.coll .lb{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--navy);margin-bottom:6px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:12px;background:#f1f4fa;border:2px dashed #d6dce8;display:grid;place-items:center;font-size:20px;color:#b9c3d6;font-weight:800;position:relative}
.slot.got{background:#fff;border:2px solid var(--c);color:inherit;box-shadow:0 4px 10px rgba(20,30,60,.1)}
.slot.new{animation:popIn .6s var(--spring)}
.slot.new::after{content:'BARU';position:absolute;top:-7px;right:-6px;background:var(--red);color:#fff;font-size:8px;font-weight:800;padding:2px 5px;border-radius:6px}
.score{margin-bottom:12px}
.score .lb{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--navy);margin-bottom:5px}
.score .tr{height:9px;border-radius:9px;background:#e7ecf4;overflow:hidden}
.score .tr i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--green),#4fd39a);transition:width 1.8s var(--ease)}

@media (max-height:560px){
  .st-title{font-size:18px}.pick .ph{width:68px;height:68px}
  .ss{height:192px}.lz .o{width:62px;height:62px;font-size:24px}.lz-line{top:34px}
  #dialog .txt{font-size:14px}.e-txt{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<script>

const fLong=d=>d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fShort=d=>d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});

/* ================= AUDIO ================= */
let actx,master,bgmGain,sfxGain,dly,bgmTimer=null,bgmOn=true,nextT=0,step=0,noiseBuf=null;
function initAudio(){
  if(actx){actx.resume();return}
  try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=actx.createGain();master.gain.value=.9;master.connect(actx.destination);
  bgmGain=actx.createGain();bgmGain.gain.value=0;bgmGain.connect(master);
  sfxGain=actx.createGain();sfxGain.gain.value=.8;sfxGain.connect(master);
  dly=actx.createDelay();dly.delayTime.value=.36;const fb=actx.createGain();fb.gain.value=.32;const wet=actx.createGain();wet.gain.value=.3;
  dly.connect(fb);fb.connect(dly);dly.connect(wet);wet.connect(bgmGain);
  noiseBuf=actx.createBuffer(1,actx.sampleRate*.5,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function note(f,t,dur,type,vol,dest,att=.01,rel=.2,cut){
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  let node=o;if(cut){const fl=actx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);node=fl}
  node.connect(g);g.connect(dest);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.setValueAtTime(vol,t+Math.max(att,dur-rel));g.gain.linearRampToValueAtTime(0,t+dur);
  o.start(t);o.stop(t+dur+.05);return o;
}
function noise(t,dur,vol,dest,hp=6000,lp){
  const s=actx.createBufferSource();s.buffer=noiseBuf;const f=actx.createBiquadFilter();f.type=lp?'lowpass':'highpass';f.frequency.value=lp||hp;
  const g=actx.createGain();s.connect(f);f.connect(g);g.connect(dest);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.start(t);s.stop(t+dur+.02);
}
const CH=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[55,59,62,65]];
const PENTA=[72,74,76,79,81,84];
const BEAT=60/80,E8=BEAT/2;
function schedule(){
  while(nextT<actx.currentTime+.25){
    const bar=Math.floor(step/8)%4,s=step%8,t=nextT,ch=CH[bar];
    if(s===0){ch.forEach(m=>{note(mtof(m),t,BEAT*4,'triangle',.026,bgmGain,.5,.9,1100);note(mtof(m)*1.004,t,BEAT*4,'sine',.018,bgmGain,.6,.9)})}
    if(s===0||s===5){note(mtof(ch[0]-12),t,BEAT*1.4,'sine',.12,bgmGain,.02,.4)}
    if(s===0||s===4){const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(bgmGain);o.start(t);o.stop(t+.25)}
    if(s===2||s===6){noise(t,.12,.03,bgmGain,0,1800)}
    if(s%2===1){noise(t,.04,.02,bgmGain,7000)}
    if(Math.random()<((s%2===0)?.3:.12)){const m=PENTA[Math.floor(Math.random()*PENTA.length)];const o=note(mtof(m),t,E8*1.6,'sine',.04,bgmGain,.01,.25);
      const g2=actx.createGain();g2.gain.value=.5;o.connect(g2);g2.connect(dly)}
    nextT+=E8;step++;
  }
}
function startBgm(){if(!actx||bgmTimer)return;nextT=actx.currentTime+.08;step=0;bgmTimer=setInterval(schedule,40);
  bgmGain.gain.cancelScheduledValues(actx.currentTime);bgmGain.gain.setValueAtTime(bgmGain.gain.value,actx.currentTime);bgmGain.gain.linearRampToValueAtTime(.5,actx.currentTime+1.2)}
function stopBgm(){if(!actx||!bgmTimer)return;const t=actx.currentTime;bgmGain.gain.cancelScheduledValues(t);bgmGain.gain.setValueAtTime(bgmGain.gain.value,t);bgmGain.gain.linearRampToValueAtTime(0,t+.6);
  const id=bgmTimer;bgmTimer=null;setTimeout(()=>clearInterval(id),650)}
$('#bgmBtn').addEventListener('click',()=>{initAudio();bgmOn=!bgmOn;$('#bgmBtn').classList.toggle('on',bgmOn);bgmOn?startBgm():stopBgm();sfx('tap')});
document.addEventListener('visibilitychange',()=>{if(!actx)return;document.hidden?actx.suspend():actx.resume()});
function sfx(k){
  if(!actx)return;const t=actx.currentTime+.01,d=sfxGain;
  switch(k){
    case 'tap':note(720,t,.07,'triangle',.07,d,.005,.05);break;
    case 'pop':note(880,t,.07,'sine',.1,d,.005,.05);note(1320,t+.05,.08,'sine',.08,d,.005,.06);break;
    case 'send':note(600,t,.06,'sine',.08,d);note(900,t+.04,.08,'sine',.07,d);break;
    case 'ding':note(988,t,.25,'sine',.12,d,.005,.2);note(1319,t+.12,.35,'sine',.1,d,.005,.3);break;
    case 'beep':note(1760,t,.08,'square',.05,d,.003,.03,4000);note(2350,t+.11,.16,'square',.05,d,.003,.05,4000);break;
    case 'buzz':for(let i=0;i<3;i++){note(120,t+i*.14,.1,'square',.05,d,.005,.03,400)}break;
    case 'whoosh':{const s=actx.createBufferSource();s.buffer=noiseBuf;const f=actx.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;
      f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(3000,t+.35);const g=actx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.1);g.gain.linearRampToValueAtTime(0,t+.4);
      s.connect(f);f.connect(g);g.connect(d);s.start(t);s.stop(t+.45);break}
    case 'thud':noise(t,.22,.3,d,0,600);note(70,t,.2,'sine',.3,d,.003,.15);break;
    case 'click':noise(t,.03,.15,d,3000);note(1400,t,.03,'square',.03,d,.002,.02);break;
    case 'warn':for(let i=0;i<2;i++){note(880,t+i*.22,.12,'square',.05,d,.004,.04,2500)}break;
    case 'tilt':{const o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();o.type='sawtooth';f.type='lowpass';f.frequency.value=700;
      o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(90,t+.45);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.05);g.gain.linearRampToValueAtTime(0,t+.5);
      o.connect(f);f.connect(g);g.connect(d);o.start(t);o.stop(t+.55);break}
    case 'flip':note(520,t,.06,'triangle',.06,d);note(780,t+.06,.08,'triangle',.06,d);break;
    case 'lens':note(660,t,.18,'sine',.08,d,.005,.15);note(990,t+.08,.3,'sine',.07,d,.005,.25);break;
    case 'tick':note(1200,t,.08,'triangle',.06,d,.003,.06);break;
    case 'low':note(196,t,.5,'triangle',.07,d,.02,.3,900);note(147,t+.25,.7,'triangle',.06,d,.02,.4,900);break;
    case 'win':[60,64,67,72,76].forEach((m,i)=>note(mtof(m+12),t+i*.09,.35,'triangle',.08,d,.005,.25));break;
  }
}

    t.textContent='';t.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:350,easing:'cubic-bezier(.22,1,.36,1)'});

function burst(color){
  const fx=$('#fx'),cols=[color,'#e3343f','#3b6cc0','#f2b33d','#25a96f'];
  for(let i=0;i<40;i++){const e=document.createElement('i');e.style.background=cols[i%cols.length];fx.appendChild(e);
    const a=Math.random()*Math.PI*2,d=90+Math.random()*170,x=Math.cos(a)*d,y=Math.sin(a)*d-60;
    e.animate([{transform:'translate(-50%,-50%) rotate(0) scale(.4)',opacity:1},{transform:`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) rotate(${Math.random()*540}deg) scale(1)`,opacity:1,offset:.55},
      {transform:`translate(calc(-50% + ${x*1.1}px),calc(-50% + ${y+180}px)) rotate(${Math.random()*720}deg) scale(.8)`,opacity:0}],
      {duration:1900+Math.random()*900,easing:'cubic-bezier(.22,1,.36,1)',fill:'forwards'}).onfinish=()=>e.remove();}
}

  const BASE=[
    {n:'CEK DAMPAK',h:'Kelihatan simpel buat kita, belum tentu buat mereka.',p:'Di layar RKB, Andi cuma satu baris nama. Buat Andi, itu acara keluarga dan tiket yang udah dibeli berbulan-bulan.',q:'Sebelum pakai wewenang, tanya dulu: siapa yang kena dampaknya?'},
    {n:'CEK ADIL',h:'Adil itu soal alasan, bukan soal semua senang.',p:'Ada keputusan yang memang berat. Yang bikin tim tetap percaya adalah prosesnya: alasannya jelas, dampaknya udah dipikirin, dan nggak dipaksakan sepihak.',q:'Hasil bisa sama. Cara sampai ke sana yang bikin beda.'},
    {n:'CEK WEWENANG & LANGKAH',h:'Tahu batas, dan jangan menghilang.',rules:[['PUTUSKAN','Kalau memang bagianmu, ambil dengan tanggung jawab.'],['NAIKKAN','Kalau di luar wewenangmu, bawa ke atasan yang berwenang.'],['KABARI','Selama belum final, tetap kasih update.']]},
    {n:'JAGA AMANAH',h:'Jabatan itu titipan.',p:'Wewenang bukan buat kepentingan pribadi, bukan buat nekan orang, dan bukan buat keputusan suka-suka yang nggak bisa dipertanggungjawabkan.',q:'Punya wewenang ≠ bebas memakai wewenang.'}
  ];
  const C=S.seenReflect?[ME]:[ME,...BASE];
  P.innerHTML=`<div class="rf-top fu"><div class="rf-k">${charSVG({...o,cls:'pl',crop:'avatar',mood:'calm'})}</div><div class="rf-h"><small>REFLEKSI</small><b>Yang bisa kita bawa pulang</b></div></div>
    <div class="rf-stage" id="rfs"></div><div class="rf-dots">${C.map(()=>'<i></i>').join('')}</div><button class="btn blue" id="rfBtn">Berikutnya ▶</button>`;
  show('#reflect');
  for(let i=0;i<C.length;i++){
    const c=C[i],d=document.createElement('div');d.className='rcard enter';
    if(c.me){d.classList.add('me');d.style.setProperty('--c',E.c);
      d.innerHTML=`<span class="n">${i+1} / ${C.length} · ${c.n}</span><h3>${c.h}</h3>
        <div class="sec ok"><b>✓ Yang kamu jaga</b><p>${c.keep}</p></div>
        <div class="sec warn"><b>⚠ Sisi lain yang perlu disadari</b>${c.risk.map(r=>`<p>${r}</p>`).join('')}</div>
        <div class="sec nx"><b>💡 Kalau terjadi lagi</b><p>${c.next}</p></div>`;
    }else
    d.innerHTML=`<span class="n">${i+1} / ${C.length} · ${c.n}</span><h3>${c.h}</h3>${c.p?`<p>${c.p}</p>`:''}${c.rules?`<div class="rules">${c.rules.map(r=>`<div><b>${r[0]}</b>${r[1]}</div>`).join('')}</div>`:''}${c.q?`<div class="q">${c.q}</div>`:''}`;
    $('#rfs').appendChild(d);void d.offsetWidth;d.classList.remove('enter');sfx('flip');
    $$('.rf-dots i').forEach((x,j)=>x.classList.toggle('on',j===i));
    $('#rfBtn').textContent=i===C.length-1?'Lanjut ke penutup ✓':'Berikutnya ▶';
    await clickOnce($('#rfBtn'));sfx('tap');d.classList.add('exit');await wait(380);d.remove();
  }
  S.seenReflect=true;hide('#reflect');await wait(450);
}
async function closing(isNew){
  const C=$('#closing');S.helmet=false;drawPlayers();exp('EXP_01');light('golden');
  const pl=$('#player');pl.style.left='50%';pl.style.bottom='50%';pl.style.height='40%';
  const slots=['END_1','END_2','END_3','END_4','END_5'].map(k=>{const E=ENDS[k],got=FOUND.includes(k);
    return `<div class="slot ${got?'got':''} ${got&&isNew&&k===S.reachedEnding?'new':''}" style="--c:${E.c}" title="${got?E.t:'Belum ketemu'}">${got?E.ic:'?'}</div>`}).join('');
  C.innerHTML=`<div class="cl-card">
    <div class="say"><span class="who">${SAP().toUpperCase()}</span>Kita udah belajar jaga wewenang dan mikirin dampaknya ke tim. Tapi ada satu situasi lagi yang sering nguji kita sebagai leader: bukan waktu orang datang minta keputusan, tapi waktu mereka datang bawa <b>kabar buruk</b> yang sebenarnya nggak pengen kita dengar.</div>
    <div class="v18"><span class="nx">▶</span><div>SELANJUTNYA DI V18<b>Ketika Kabar Buruk Sampai Kepada Kita</b></div></div>
    <div class="coll"><div class="lb"><span>Ending yang udah kamu temukan</span><span>${FOUND.length} / 5</span></div><div class="slots">${slots}</div></div>
    <div class="score" id="scoreBar"><div class="lb"><span>Misi 9 selesai</span><span id="pct">0%</span></div><div class="tr"><i id="sfill"></i></div></div>
    <div class="e-btns"><button class="btn ghost" id="again">↺ Dari awal</button><button class="btn blue" id="retry">🔍 Cari ending lain</button></div></div>`;
  show('#closing');await wait(1000);nod();
  requestAnimationFrame(()=>{$('#sfill').style.width='100%'});
  let p=0;const iv=setInterval(()=>{p=Math.min(100,p+4);$('#pct').textContent=p+'%';if(p>=100)clearInterval(iv)},70);
  setTimeout(()=>{
    try{window.parent.postMessage("scoreBarFound", "*");}catch(e){}
    try{window.top.postMessage("scoreBarFound", "*");}catch(e){}
  },1900);
  $('#again').addEventListener('click',()=>{sfx('tap');restart(1)});
  $('#retry').addEventListener('click',()=>{sfx('tap');restart(4)});
}

/* ================= FLOW ================= */
async function run(from=2){
  if(from<=2){await babak2();await babak3()}
  await babak4();await babak5();await babak6();await babak7();
}
async function restart(from){
  ['#closing','#ending','#reflect','#split','#seesaw','#lens','#rkb','#modal','#sheet','#scene'].forEach(hide);
  $('#dim').classList.remove('on');hideDlg();if(phone.open)await phone.hide();
  const pl=$('#player');pl.style.bottom='';pl.style.height='';pl.style.left='';
  Object.assign(S,{initialOption:null,initialReasonChip:null,judgementUpdate:null,judgementReason:null,activeNode:null,reachedEnding:null,path:[],helmet:false});
  phone.cur=null;phone.clear();$('#fx').innerHTML='';$('#npcs').innerHTML='';drawPlayers();
  await wait(600);
  if(from===1){
    S.teamCapacity=100;S.rkbTomorrowDate=new Date(Date.now()+86400000);light('');
    $('#stage').classList.add('hud-off');prog(1);$('#cam').classList.add('blur');
    $('#badge').className='badge-wrap swing';$('#idc').classList.remove('ok','scan');$('#scanner').classList.remove('on');
    $('#start').classList.remove('hide','out');
  }else{light('tense');run(4)}
}

/* ================= BABAK 1 · ID CARD ================= */
const QN={MALE:['Raka','Dimas','Bayu'],FEMALE:['Sinta','Ratna','Nadia']};
let picked=false;
function renderPicks(){
  $('#picks').innerHTML=['MALE','FEMALE'].map(g=>{const o=g==='MALE'?{hair:'m'}:{hair:'f',skin:'#f6bfa6',skinD:'#e49d85'};
    return `<button class="pick" data-g="${g}"><span class="ph">${charSVG({...o,uni:'kordel',lanyard:true,crop:'id',mood:'smile'})}</span><small>Kordel ${g==='MALE'?'Laki-laki':'Perempuan'}</small></button>`}).join('');
  $$('.pick').forEach(b=>b.addEventListener('click',()=>{initAudio();picked=true;
    const g=b.dataset.g,changed=g!==S.playerGender;S.playerGender=g;S.playerHonorific=g==='MALE'?'Pak':'Bu';
    $('#picks').classList.add('chosen');$$('.pick').forEach(x=>x.classList.toggle('sel',x===b));sfx('pop');
    const c=b.querySelector('.ch');c.classList.remove('hop');void c.getBoundingClientRect();c.classList.add('hop');
    if(changed){S.playerName='';$('#nameIn').value='';$('#nameIn').classList.remove('show')}
    renderQ();updSapa();drawPlayers()}));
}
function renderQ(){
  $('#qrow').innerHTML=QN[S.playerGender].map(n=>`<button class="qchip ${S.playerName===n?'sel':''}">${n}</button>`).join('')+'<button class="qchip own">✏️ Nama lain</button>';
  $$('#qrow .qchip').forEach(b=>b.addEventListener('click',()=>{sfx('tap');
    if(b.classList.contains('own')){const i=$('#nameIn');i.classList.add('show');i.focus();$$('#qrow .qchip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');S.playerName=i.value.trim();updSapa();return}
    $('#nameIn').classList.remove('show');S.playerName=b.textContent;$$('#qrow .qchip').forEach(x=>x.classList.toggle('sel',x===b));updSapa()}));
}
function updSapa(){
  const ok=picked&&S.playerName.length>=2;
  $('#sapaPrev').textContent=ok?`${S.playerHonorific} ${S.playerName} — Koordinator Delivery`:(picked?'Pilih nama panggilan':'Pilih karakter dulu');
  $('#sapa').classList.toggle('lock',ok);$('#goBtn').disabled=!ok;$('#spName').textContent=`${S.playerHonorific} ${S.playerName||'…'} · Kordel`;
}
$('#nameIn').addEventListener('input',()=>{const v=$('#nameIn').value.trim();S.playerName=v.charAt(0).toUpperCase()+v.slice(1);updSapa()});
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('#goBtn').disabled){$('#nameIn').blur();$('#goBtn').click()}});
$('#goBtn').addEventListener('click',async()=>{
  const b=$('#goBtn');if(b.dataset.busy)return;b.dataset.busy=1;
  initAudio();if(bgmOn)startBgm();$('#nameIn').blur();
  const bw=$('#badge');bw.classList.remove('swing');void bw.offsetWidth;bw.classList.add('toScan');await wait(450);
  const idc=$('#idc');idc.classList.add('scan');$('#scanner').classList.add('on');sfx('beep');await wait(620);idc.classList.add('ok');await wait(380);
  drawPlayers();exp('EXP_01');light('morning');
  cam(1.2,18,62);$('#cam').classList.remove('blur');
  $('#start').classList.add('out');await wait(600);$('#start').classList.add('hide');
  $('#stage').classList.remove('hud-off');prog(1);delete b.dataset.busy;
  run(2);
});
renderPicks();renderQ();updSapa();drawPlayers();$('#cam').classList.add('blur');prog(1);
</script>
